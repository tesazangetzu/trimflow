# Render Blueprint — TrimFlow Backend
# Build nativo de Node (más robusto para monorepos que Docker en Render)
# La base de datos (Neon) y el frontend (Vercel) se configuran por separado.

services:
  - type: web
    name: trimflow-backend
    runtime: node
    repo: https://github.com/tesazangetzu/trimflow
    rootDir: backend
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/main
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Lima
      - key: PORT
        value: 3000
      - key: API_PREFIX
        value: v1
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: TENANT_DB_SCHEMA_PREFIX
        value: tenant_
      - key: RATE_LIMIT_TTL
        value: 60
      - key: RATE_LIMIT_MAX
        value: 100