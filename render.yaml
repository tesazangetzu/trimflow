# Render Blueprint — TrimFlow Backend
# Este archivo define el servicio backend para Render.
# La base de datos (Neon) y el frontend (Vercel) se configuran por separado.

services:
  - type: web
    name: trimflow-backend
    runtime: docker
    repo: https://github.com/tesazangetzu/trimflow
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: API_PREFIX
        value: v1
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: TENANT_DB_SCHEMA_PREFIX
        value: tenant_
      - key: RATE_LIMIT_TTL
        value: 60
      - key: RATE_LIMIT_MAX
        value: 100