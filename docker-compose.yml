
services:
  postgres:
    image: postgres:18-alpine
    container_name: trimflow-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: trimflow
      POSTGRES_PASSWORD: trimflow
      POSTGRES_DB: trimflow
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trimflow -d trimflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trimflow-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass redispass
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: development
    container_name: trimflow-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      TZ: America/Lima
      DATABASE_URL: postgresql://trimflow:trimflow@postgres:5432/trimflow
      REDIS_URL: redis://default:redispass@redis:6379
    env_file:
      - ./backend/.env.development
    volumes:
      - ./backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
